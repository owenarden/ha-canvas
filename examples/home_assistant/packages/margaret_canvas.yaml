template:
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/15"

    actions:
      - action: calendar.get_events
        target:
          entity_id: calendar.canvas_margaret_arden_margaret_arden_calendar
        data:
          duration:
            days: 28
        response_variable: canvas_agenda

    sensor:
      - name: "Margaret Canvas Assignments 28 Days"
        unique_id: margaret_canvas_assignments_28_days
        icon: mdi:school
        state: >
          {% set cal = 'calendar.canvas_margaret_arden_margaret_arden_calendar' %}
          {{ canvas_agenda.get(cal, {}).get('events', []) | count }}
        attributes:
          events: >
            {% set cal = 'calendar.canvas_margaret_arden_margaret_arden_calendar' %}
            {{ canvas_agenda.get(cal, {}).get('events', []) }}
